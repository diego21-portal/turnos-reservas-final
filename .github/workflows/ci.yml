name: CI

on:
  push:
    branches: ["main", "correccion-entrega-final"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Syntax and automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify
